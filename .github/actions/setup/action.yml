name: Set up the workspace
description: pnpm, Node with the pnpm store cached, and the workspace's dependencies. Runs after actions/checkout.

inputs:
  registry-url:
    description: The npm registry setup-node writes an .npmrc for, when the job publishes.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: 12.22.0
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 24
        package-manager-cache: false
        registry-url: ${{ inputs.registry-url }}
    - id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    # Only main saves the store; pull requests and the merge queue read it. Saved from every ref, as
    # setup-node's own cache does when the lockfile changes, copies of hundreds of megabytes filled
    # the repository's cache, and GitHub's eviction took the mutation reports with them.
    - id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
