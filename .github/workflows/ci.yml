name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm generate
      - run: pnpm typecheck
      - run: pnpm --filter @bounda-dev/example-onboarding build
      - run: pnpm test
      - run: pnpm test:types

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

  changes:
    name: Changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: list
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base" HEAD)
          all="core sqlite postgresql cli react-router create-bounda cloudflare"
          if echo "$changed" | grep -qE '^(pnpm-workspace\.yaml|pnpm-lock\.yaml|patches/|\.github/workflows/ci\.yml|tsconfig\.base\.json)'; then
            selected="$all"
          else
            selected=""
            for package in $all; do
              if echo "$changed" | grep -q "^packages/$package/"; then selected="$selected $package"; fi
            done
          fi
          packages=$(printf '%s\n' $selected | sed '/^$/d' | jq -R . | jq -sc .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Mutation testing for: $packages"

  # People run Bounda on Windows too, so the packages a project uses there are tested there
  # whenever one changes. Each step runs even if an earlier test step failed, so one run shows
  # every package. Some tests stay on Linux: create-bounda's end-to-end test links tools and stops
  # servers by process group, and libSQL's server and PostgreSQL run in Linux containers.
  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm build
      - name: core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @bounda-dev/core test
      - name: sqlite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @bounda-dev/sqlite exec vitest run --exclude src/libsql-server.test.ts
      - name: cli
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @bounda-dev/cli test
      - name: react-router
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @bounda-dev/react-router test
      - name: create-bounda
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter create-bounda exec vitest run --exclude src/run.e2e.test.ts

  # The timeout fits a full run, not just an incremental one: GitHub evicts a cache nobody has
  # read for a week, so the first run after a quiet week mutates the whole package, and core
  # alone then takes about three quarters of an hour.
  mutation:
    name: Mutation (${{ matrix.package }})
    needs: [changes, check]
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    env:
      BOUNDA_PG_REUSE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/${{ matrix.package }}/.stryker-tmp/incremental.json
          key: stryker-${{ matrix.package }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.package }}-
      - run: pnpm build
      - shell: bash
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          reporters=()
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "${STRYKER_DASHBOARD_API_KEY:-}" ]; then
            reporters=(--reporters clear-text,progress,html,dashboard)
          fi
          pnpm --filter "./packages/${{ matrix.package }}" test:mutation "${reporters[@]}" 2>&1 | tee mutation.log
      - if: always()
        shell: bash
        run: |
          {
            echo "## Mutation testing: ${{ matrix.package }}"
            echo
            echo '```text'
            sed -n '/^-*|/,/^-*|$/p' mutation.log | head -60
            grep -E "Final mutation score" mutation.log | sed 's/.*INFO MutationTestReportHelper//' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/${{ matrix.package }}/.stryker-tmp/incremental.json
          key: stryker-${{ matrix.package }}-${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ matrix.package }}
          path: packages/${{ matrix.package }}/reports/mutation/mutation.html
          if-no-files-found: ignore
          retention-days: 14

