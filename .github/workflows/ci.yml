name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm generate
      - run: pnpm typecheck
      - run: pnpm --filter @bounda-dev/example-onboarding build

  # The suite split across runners: no file is split, so the longest file (create-bounda's
  # end-to-end test) sets the floor, and more shards than this would only add setup.
  test:
    name: Test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # Whether the step below can log in; the token itself stays out of the job's environment,
      # where every step, the tests included, would see it.
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      # A read-only Docker Hub token, so the images the tests start are pulled authenticated. Pull
      # requests from forks get no secrets and pull anonymously.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm generate
      # Coverage is collected here and judged in test-report: a shard alone falls short of the
      # thresholds.
      - run: >-
          pnpm exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default --reporter=blob --coverage
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The shards add up to the whole run: its result, and its coverage, held to the thresholds in
  # vitest.config.ts, which no single shard could meet.
  test-report:
    name: Test report and coverage
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - shell: bash
        run: |
          status=0
          pnpm exec vitest run --merge-reports --coverage 2>&1 | tee merge.log || status=$?
          {
            echo "## Coverage"
            echo
            echo '```text'
            sed 's/\x1b\[[0-9;]*m//g' merge.log | grep -E "^(Statements|Branches|Functions|Lines) +:|threshold" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - run: pnpm docs:build

  changes:
    name: Changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      mutation: ${{ steps.list.outputs.mutation }}
      sharded: ${{ steps.list.outputs.sharded }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: list
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base" HEAD)
          all="core sqlite postgresql cli react-router create-bounda cloudflare test-containers"
          if echo "$changed" | grep -qE '^(pnpm-workspace\.yaml|pnpm-lock\.yaml|patches/|\.github/workflows/ci\.yml|\.github/actions/|tsconfig\.base\.json)'; then
            selected="$all"
          else
            selected=""
            for package in $all; do
              if echo "$changed" | grep -q "^packages/$package/"; then selected="$selected $package"; fi
            done
          fi
          packages=$(printf '%s\n' $selected | sed '/^$/d' | jq -R . | jq -sc .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Mutation testing for: $packages"
          # The packages whose mutants are too many for one job, and the shards each runs in.
          shard_counts='{"core": 8, "cli": 2, "postgresql": 3}'
          # The merge queue skips mutation testing: the pull request ran it on the same changes, and
          # main runs it again once they land.
          if [ "${{ github.event_name }}" = "merge_group" ]; then mutated=""; else mutated="$selected"; fi
          mutation=$(for package in $mutated; do
            shards=$(jq -r --arg package "$package" '.[$package] // 1' <<<"$shard_counts")
            for shard in $(seq 1 "$shards"); do
              jq -nc --arg package "$package" --argjson shard "$shard" --argjson shards "$shards" \
                '{package: $package, shard: $shard, shards: $shards}'
            done
          done | jq -sc .)
          echo "mutation=$mutation" >> "$GITHUB_OUTPUT"
          echo "sharded=$(echo "$mutation" | jq -c '[.[] | select(.shards > 1) | .package] | unique')" >> "$GITHUB_OUTPUT"

  # People run Bounda on Windows too, so the packages a project uses there are tested there
  # whenever one changes. Each step runs even if an earlier test step failed, so one run shows
  # every package. Some tests stay on Linux: create-bounda's end-to-end test links tools and stops
  # servers by process group, and libSQL's server and PostgreSQL run in Linux containers.
  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # A worker that dies in native code, as libSQL can there, names the test it was running.
      BOUNDA_TEST_TRACE: "1"
    steps:
      # The tests write their databases under the system's temporary directory, on C:, where each
      # commit synced to disk waited up to seconds and timed tests out; on the runner's own temporary
      # directory, on D:, the same runs took a fraction of that.
      - run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - id: build
        run: pnpm build
      - name: core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @bounda-dev/core test
      - name: sqlite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @bounda-dev/sqlite exec vitest run --exclude src/libsql-server.test.ts --reporter=verbose
      - name: cli
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @bounda-dev/cli test
      - name: react-router
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @bounda-dev/react-router test
      - name: create-bounda
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter create-bounda exec vitest run --exclude src/run.e2e.test.ts

  # The SQLite adapter works around a double close in libSQL's native module (src/close-once.ts).
  # The second close reads freed memory, which faults on Windows only now and then and on Linux
  # never; under macOS's Guard Malloc it faults every time, so here a regression fails for certain.
  guard-malloc:
    name: libSQL closes under Guard Malloc
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.packages), 'sqlite')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @bounda-dev/core build
      # The test runs without Guard Malloc where the library is missing or dyld will not load it into
      # node, which would prove nothing.
      - run: DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib node -e "" 2>&1 | grep -q GuardMalloc
      - run: pnpm --filter @bounda-dev/sqlite exec vitest run src/close-once.test.ts

  # The timeout fits a full run of a job, not just an incremental one: GitHub evicts a cache nobody
  # has read for a week, and a job the timeout cancels saves none, since Stryker writes its
  # incremental file at the end. A package whose full run would not fit is split into shards, each
  # mutating the files a hash of their path gives it (.github/scripts/mutation-shard.ts), so a file
  # keeps its shard and each shard its own cache; each shard holds the break threshold on its own.
  # It starts alongside `check` rather than after it: mutation is the longest job, and waiting
  # would add `check`'s whole run to every pull request's.
  mutation:
    name: Mutation (${{ matrix.package }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    needs: changes
    if: needs.changes.outputs.mutation != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.mutation) }}
    env:
      # Stryker runs the tests once per mutant: PostgreSQL's and the libSQL server's keep one
      # container for all of them.
      BOUNDA_PG_REUSE: "1"
      BOUNDA_LIBSQL_REUSE: "1"
      SHARD: ${{ matrix.shards > 1 && format('-{0}-of-{1}', matrix.shard, matrix.shards) || '' }}
      # As in the check job.
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      # As in the check job.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/${{ matrix.package }}/.stryker-tmp/incremental${{ env.SHARD }}.json
          key: stryker-${{ matrix.package }}${{ env.SHARD }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.package }}${{ env.SHARD }}-
      - run: pnpm build
      - shell: bash
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          args=()
          if [ "${{ matrix.shards }}" -gt 1 ]; then
            # A shard's report is merged with the others' by the mutation-report job, which sends
            # the whole to the dashboard.
            files=$(node .github/scripts/mutation-shard.ts "${{ matrix.package }}" "${{ matrix.shard }}" "${{ matrix.shards }}")
            args=(--mutate "$files" --incrementalFile ".stryker-tmp/incremental${SHARD}.json" --reporters clear-text,progress,html,json)
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "${STRYKER_DASHBOARD_API_KEY:-}" ]; then
            args=(--reporters clear-text,progress,html,dashboard)
          fi
          # Vitest adds a job summary on every run Stryker starts, one per mutant, past what GitHub
          # takes; the step below writes the one that matters.
          env -u GITHUB_STEP_SUMMARY pnpm --filter "./packages/${{ matrix.package }}" test:mutation "${args[@]}" 2>&1 | tee mutation.log
      - if: always()
        shell: bash
        run: |
          {
            echo "## Mutation testing: ${{ matrix.package }}${SHARD}"
            echo
            echo '```text'
            awk '/^-*\|/,/^-*\|$/ { if (n++ < 60) print substr($0, 1, 200) }' mutation.log
            grep -E "Final mutation score" mutation.log | sed 's/.*INFO MutationTestReportHelper//' | head -n 1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/${{ matrix.package }}/.stryker-tmp/incremental${{ env.SHARD }}.json
          key: stryker-${{ matrix.package }}${{ env.SHARD }}-${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ matrix.package }}${{ env.SHARD }}
          path: |
            packages/${{ matrix.package }}/reports/mutation/mutation.html
            packages/${{ matrix.package }}/reports/mutation/mutation.json
          if-no-files-found: ignore
          retention-days: 14

  # The shards of a package add up to the report of a whole run: its score in the summary, and on
  # main the whole report on the dashboard, as the dashboard reporter sends one. It runs once the
  # shards ran, whether or not they passed.
  mutation-report:
    name: Mutation report (${{ matrix.package }})
    needs: [changes, mutation]
    if: ${{ !cancelled() && needs.changes.outputs.sharded != '[]' && (needs.mutation.result == 'success' || needs.mutation.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.sharded) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-${{ matrix.package }}-*
          path: shards
      - shell: bash
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          mapfile -t reports < <(find shards -name mutation.json | sort)
          node .github/scripts/mutation-report.ts merged.json "${reports[@]}" | tee score.txt
          {
            echo "## Mutation testing: ${{ matrix.package }}"
            echo
            echo '```text'
            cat score.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The dashboard only shows the score: when it is down, main stays green and says so.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "${STRYKER_DASHBOARD_API_KEY:-}" ]; then
            curl --fail-with-body --silent --show-error -X PUT \
              -H "X-Api-Key: $STRYKER_DASHBOARD_API_KEY" -H "Content-Type: application/json" \
              --data-binary @merged.json \
              "https://dashboard.stryker-mutator.io/api/reports/github.com/${GITHUB_REPOSITORY}/main?module=${{ matrix.package }}" \
              || echo "::warning::The Stryker dashboard did not take the ${{ matrix.package }} report"
          fi

  # The one check branch protection and a merge queue need to require: it fails when any job above
  # failed or was cancelled, and passes when the rest succeeded or were skipped because the change
  # does not reach them.
  passed:
    name: CI passed
    needs: [check, test, test-report, docs, changes, windows, guard-malloc, mutation, mutation-report]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            while IFS= read -r job; do echo "::error::$job"; done <<<"$failed"
            exit 1
          fi

