      <text x="740" y="476" text-anchor="middle"><tspan font-weight="600">Read models</tspan><tspan dx="8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">app/read/&lt;read-model&gt;</tspan></text>
